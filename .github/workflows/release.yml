name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install deps
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Build
        run: nix develop --command pnpm build

      - name: Pack
        run: |
          nix develop --command pnpm pack --pack-destination .
          mv happybirthday-noguchi-*.tgz happybirthday-noguchi.tgz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          Install & run:

          \`\`\`sh
          npx https://github.com/${REPO}/releases/latest/download/happybirthday-noguchi.tgz
          \`\`\`
          EOF
          gh release create "$TAG" \
            happybirthday-noguchi.tgz \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest
