name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install deps
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Build
        run: nix develop --command pnpm build

      - name: Pack
        run: |
          nix develop --command pnpm pack --pack-destination .
          mv happybirthday-noguchi-*.tgz happybirthday-noguchi.tgz

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: happybirthday-noguchi.tgz
          generate_release_notes: false
          body: |
            Install & run:

            ```sh
            npx https://github.com/${{ github.repository }}/releases/latest/download/happybirthday-noguchi.tgz
            ```
